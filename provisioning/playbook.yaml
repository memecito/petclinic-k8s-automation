---
- name: Aprovisionar K3s, registry, app y Jenkins
  hosts: all
  become: true

  vars:
    # Definimos las versiones como variables para facilitar su mantenimiento
    k3s_version: "v1.31.4+k3s1"      # Versión estable de K3s
    helm_version: "v3.17.0"          # Versión de Helm
    jenkins_chart_version: "5.8.122"   # Versión específica del Chart de Jenkins
    jenkins_tag: "2.528.3-lts"        # Versión específica de Jenkins
    registry_image_tag: "2.8.3"      # Versión específica de la imagen del Registry
    app_repo: "https://github.com/spring-petclinic/spring-petclinic-microservices.git"
    app_version: "v3.4.1"            # Tag fijo del código de la app (build.sh espera JARs 3.4.1)
    app_dir: "/home/vagrant/app"
    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    # Usuario sin privilegios que usa el clúster (kubectl y los módulos de Helm, que con
    # ansible_local leen el kubeconfig como este usuario, no como root)
    kube_user: "vagrant"
    kube_user_config: "/home/{{ kube_user }}/.kube/config"
    # IP de la red privada (la que se usa desde el host). ansible_default_ipv4 es la NAT 10.0.2.15
    access_ip: "{{ ansible_facts['eth1']['ipv4']['address'] | default(ansible_default_ipv4.address) }}"

  tasks:
    # --- PREPARACIÓN DEL S.O. ---
    - name: Upgrade all packages (Security only)
      ansible.builtin.dnf:
        name: "*"
        state: latest  # noqa: package-latest
        security: true   # solo erratas de seguridad, como dice el nombre de la tarea

    # La box trae firewalld instalado pero parado: sin el servicio no se pueden abrir puertos
    - name: Instalar y arrancar firewalld
      block:
        - name: Instalar firewalld
          ansible.builtin.dnf:
            name: firewalld
            state: present

        - name: Arrancar firewalld
          ansible.builtin.systemd_service:
            name: firewalld
            state: started
            enabled: true

    # Recomendación de K3s con firewalld: confiar en las redes de pods y de Services,
    # o el tráfico entre pods y hacia CoreDNS se bloquea
    - name: Confiar en las redes internas de K3s
      ansible.posix.firewalld:
        source: "{{ item }}"
        zone: trusted
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 10.42.0.0/16     # pods
        - 10.43.0.0/16     # Services

    - name: Open firewall ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 8080/tcp         # Jenkins
        - 5000/tcp         # Registry
        - 6443/tcp         # K3s API
        - 80/tcp           # HTTP
        - 443/tcp          # HTTPS
        - 3000/tcp         # Grafana (LoadBalancer de K3s)
        - 30000-32767/tcp   # Rango NodePort de K8s

    # --- INSTALACIÓN DE MOTORES (PODMAN) ---
    - name: Instalar Podman y herramientas base
      ansible.builtin.dnf:
        name:
          - curl
          - git
          - unzip
          - gettext
          - podman
          - podman-docker
        state: present

    # --- K3S (Versión Pinched) ---
    # --- Registry local por HTTP (solo laboratorio) --------------------------
    # build.sh sube las imágenes a <IP>:5000 y el clúster las descarga de ahí.
    # Sin esto, Podman y containerd intentan HTTPS y fallan (ErrImagePull).
    # Recuperado de la versión anterior del playbook. En producción: registry con
    # TLS y autenticación, nunca "insecure".
    - name: Permitir el registry local por HTTP en Podman
      ansible.builtin.copy:
        dest: /etc/containers/registries.conf.d/50-local-registry.conf
        mode: '0644'
        content: |
          [[registry]]
          location = "{{ ansible_default_ipv4.address }}:5000"
          insecure = true

          [[registry]]
          location = "localhost:5000"
          insecure = true

    - name: Crear el directorio de configuración de K3s
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Configurar K3s para descargar del registry local por HTTP
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: '0644'
        content: |
          mirrors:
            "{{ ansible_default_ipv4.address }}:5000":
              endpoint:
                - "http://{{ ansible_default_ipv4.address }}:5000"
            "localhost:5000":
              endpoint:
                - "http://{{ ansible_default_ipv4.address }}:5000"

    # Sin "curl | sh": se descarga el instalador del mismo tag que la versión de K3s
    # (no el de get.k3s.io, que cambia) y se ejecuta como un paso aparte.
    - name: Descargar el instalador de K3s de su versión
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
        dest: /usr/local/bin/k3s-install.sh
        mode: '0700'

    - name: Instalar K3s con versión específica
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "--disable traefik"
      args:
        creates: /usr/local/bin/k3s

    # El kubeconfig de /etc se queda como lo deja K3s (root, 0600): K3s lo reescribe al reiniciar.
    # El usuario recibe su propia copia, también 0600: son credenciales de admin del clúster.
    - name: Crear ~/.kube del usuario del clúster
      ansible.builtin.file:
        path: "/home/{{ kube_user }}/.kube"
        state: directory
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0700'

    - name: Copiar el kubeconfig para el usuario del clúster
      ansible.builtin.copy:
        src: "{{ kubeconfig_path }}"
        dest: "{{ kube_user_config }}"
        remote_src: true
        owner: "{{ kube_user }}"
        group: "{{ kube_user }}"
        mode: '0600'

    # El kubectl de K3s usa /etc/rancher/k3s/k3s.yaml salvo que se indique KUBECONFIG
    - name: Usar el kubeconfig propio en la sesión del usuario
      ansible.builtin.lineinfile:
        path: "/home/{{ kube_user }}/.bashrc"
        line: "export KUBECONFIG=$HOME/.kube/config"

    - name: Crear symlink para kubectl
      ansible.builtin.file:
        src: /usr/local/bin/k3s
        dest: /usr/bin/kubectl
        state: link

    # --- REGISTRO LOCAL CON PODMAN ---
    - name: Eliminar contenedor previo del registro
      containers.podman.podman_container:
        name: registry
        state: absent

    - name: Levantar registro con Podman (Versión Pinched)
      containers.podman.podman_container:
        name: registry
        image: "registry:{{ registry_image_tag }}"
        state: started
        recreate: true
        publish:
          - "5000:5000"

    # --- JAVA Y MAVEN ---
    # Sin el paquete "maven": en Rocky 8 arrastra Java 8 y lo deja como java por defecto.
    # La compilación usa el wrapper ./mvnw, que descarga su propia versión de Maven.
    - name: Instalar Java 17
      ansible.builtin.dnf:
        name: java-17-openjdk-devel
        state: present

    # --- HELM Y JENKINS ---
    # --- Código de la aplicación (versión fija) -----------------------------
    # Se clona el repo original en un tag concreto: el despliegue es reproducible
    # y no depende de ningún fork. Clonado y compilado como el usuario vagrant,
    # no como root.
    - name: Clonar Spring Petclinic Microservices en una versión fija
      become: true
      become_user: vagrant
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ app_version }}"
        depth: 1

    - name: Compilar los microservicios con Maven
      become: true
      become_user: vagrant
      ansible.builtin.command: ./mvnw -B clean package -DskipTests
      environment:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk   # no depender del java por defecto del sistema
      args:
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/spring-petclinic-api-gateway/target/spring-petclinic-api-gateway-3.4.1.jar"
      register: maven_build
      until: maven_build is succeeded
      retries: 3
      delay: 10

    - name: Descargar binario de Helm (Versión Pinched)
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Mover Helm a /usr/bin
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/bin/helm
        mode: '0755'
        remote_src: true

    - name: Asegurar que no hay restos de plugins corruptos
      ansible.builtin.file:
        path: "/root/.local/share/helm/plugins/helm-diff"
        state: absent

    # El Python del sistema de Rocky 8 es 3.6 y las librerías actuales ya no lo admiten.
    # Las tareas de pip y Helm usan el Python 3.12 que trae ansible-core; el resto sigue con el
    # del sistema, porque dnf y firewalld necesitan sus bindings.
    - name: Instalar Python 3.12 con pip y PyYAML
      ansible.builtin.dnf:
        name:
          - python3.12-pip
          - python3.12-pyyaml
        state: present

    - name: Librerías de Python y Jenkins con Helm (Python 3.12)
      vars:
        ansible_python_interpreter: /usr/bin/python3.12
      block:
        - name: Instalar librerías de python (Versiones Pinched)
          ansible.builtin.pip:
            name:
              - kubernetes==31.0.0
              - jsonpatch==1.33

        - name: Añadir repo de Helm de Jenkins
          kubernetes.core.helm_repository:
            name: jenkins
            repo_url: "https://charts.jenkins.io"

        - name: Instalar Jenkins con Helm (Versión del Chart Pinched)
          kubernetes.core.helm:
            name: jenkins
            chart_ref: jenkins/jenkins
            chart_version: "{{ jenkins_chart_version }}" # <-- Esto evita cambios de sintaxis futuros
            release_namespace: devops-tools
            create_namespace: true
            kubeconfig: "{{ kube_user_config }}"
            values:
              controller:
                image:
                  tag: "{{ jenkins_tag }}"
                # El chart fija la versión de sus plugins principales, pero las dependencias se
                # resuelven a la última: con el tiempo dejan de ser compatibles (git exigía un
                # configuration-as-code más nuevo que el fijado). Se actualizan todos a la vez.
                installLatestSpecifiedPlugins: true
                admin:
                  username: "admin"
                  # Sin contraseña en el código: el chart genera una aleatoria y la guarda
                  # en el Secret "jenkins" (clave jenkins-admin-password).
                serviceType: NodePort
                nodePort: 32195

    - name: Obtener el puerto de Jenkins
      ansible.builtin.command: >-
        kubectl get svc jenkins -n devops-tools --kubeconfig /etc/rancher/k3s/k3s.yaml -o jsonpath='{.spec.ports[0].nodePort}'
      register: jenkins_port
      changed_when: false   # solo consulta, no cambia nada

    - name: URL de acceso a Jenkins
      ansible.builtin.debug:
        msg: >-
          Acceso: http://{{ access_ip }}:{{ jenkins_port.stdout }} (usuario admin).
          Contraseña: kubectl get secret jenkins -n devops-tools
          -o jsonpath='{.data.jenkins-admin-password}' | base64 -d
