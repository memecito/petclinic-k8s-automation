# Comprobaciones estáticas en cada PR y push a master.
# No levanta la VM: valida scripts, playbook y manifiestos, y busca secretos.
# Las actions y las imágenes van fijadas por SHA/digest, no por tag (un tag se puede mover).
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro"
          koalaman/shellcheck@sha256:0fa384f2a6171aef8aab2999a531c8c8158727d54a8f20157a5c3c51a734d6b2
          scripts/build.sh scripts/deploy-all.sh

  ansible-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar ansible-lint y las colecciones del playbook
        run: |
          python3 -m pip install --user ansible-lint==25.9.2
          ansible-galaxy collection install -r provisioning/requirements.yml
      - name: ansible-lint
        run: ansible-lint --offline provisioning/playbook.yaml

  kubeconform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Renderizar la plantilla con valores de ejemplo
        env:
          SERVICE_NAME: api-gateway
          IMAGE_NAME: 10.0.0.1:5000/spring-petclinic-api-gateway:0.0.1
          CONTAINER_PORT: "8080"
          SERVICE_TYPE: LoadBalancer
          EXTERNAL_PORT: "80"
        run: |
          mkdir -p rendered
          envsubst < scripts/k8s-template.yaml > rendered/api-gateway.yaml
      - name: kubeconform
        run: >-
          docker run --rm -v "$PWD/rendered:/k8s:ro"
          ghcr.io/yannh/kubeconform@sha256:9fe1fab43c414c5c9361a9e884b13484ce174780b9218680aa957861a944c029
          -strict -summary -kubernetes-version 1.31.4 /k8s

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # todo el historial, no solo el último commit
          persist-credentials: false
      - name: gitleaks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --redact --no-banner /repo
